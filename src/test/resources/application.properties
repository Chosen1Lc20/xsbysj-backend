spring.datasource.url=jdbc:h2:mem:xsbysj_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# 测试环境使用占位值，避免依赖真实腾讯云 COS 凭据。
cos.client.host=https://example.com
cos.client.secret-id=test-secret-id
cos.client.secret-key=test-secret-key
cos.client.region=ap-guangzhou
cos.client.bucket=xsbysj-test
